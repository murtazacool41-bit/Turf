<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎯 Couple's Choice - Party Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b0e1a;
            --card: #141829;
            --text: #e8edf5;
            --muted: #7a85a8;
            --primary: #6c5ce7;
            --gold: #fdcb6e;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            --border: #1e2640;
        }

        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
        }

        .container {
            background: var(--card);
            border-radius: 32px;
            padding: 28px 24px;
            max-width: 520px;
            width: 100%;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            text-align: center;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        h1 {
            color: var(--text);
            font-size: 22px;
            font-weight: 700;
        }
        h1 span {
            color: var(--gold);
        }
        .player-count {
            background: rgba(108, 92, 231, 0.15);
            color: var(--primary);
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(108, 92, 231, 0.2);
        }

        .question-number {
            color: var(--muted);
            font-size: 13px;
            margin: 8px 0 12px 0;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #1e2640;
            border-radius: 2px;
            margin: 8px 0 20px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6c5ce7, #fdcb6e);
            border-radius: 2px;
            transition: width 0.6s ease;
            width: 5%;
        }

        .question-text {
            font-size: 26px;
            font-weight: 600;
            color: var(--text);
            margin: 12px 0 20px 0;
            min-height: 70px;
            padding: 6px;
            line-height: 1.4;
        }
        .question-text .category {
            font-size: 14px;
            font-weight: 400;
            color: var(--gold);
            display: block;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        /* Player Grid */
        .player-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 16px 0 20px 0;
        }
        .player-btn {
            padding: 16px 10px;
            border: 2px solid #1e2640;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text);
            touch-action: manipulation;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .player-btn:active {
            transform: scale(0.95);
        }
        .player-btn.voted {
            border-color: #6c5ce7;
            background: rgba(108, 92, 231, 0.12);
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.08);
        }
        .player-btn .vote-badge {
            font-size: 10px;
            opacity: 0.6;
            margin-left: 6px;
        }

        .status-text {
            font-size: 14px;
            color: var(--muted);
            margin: 6px 0 14px 0;
            min-height: 22px;
        }
        .status-text .highlight {
            color: var(--gold);
        }

        /* Results */
        .results-area {
            margin: 16px 0;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-name {
            color: var(--text);
            font-size: 15px;
            font-weight: 400;
        }
        .result-bar-wrap {
            flex: 1;
            margin: 0 12px;
            height: 20px;
            background: #1e2640;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .result-bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
            background: linear-gradient(90deg, #6c5ce7, #a29bfe);
        }
        .result-bar-fill.winner {
            background: linear-gradient(90deg, #fdcb6e, #f39c12);
            box-shadow: 0 0 20px rgba(253, 203, 110, 0.2);
        }
        .result-votes {
            color: var(--muted);
            font-size: 13px;
            min-width: 30px;
            text-align: right;
        }

        .winner-announce {
            margin-top: 14px;
            padding: 14px;
            border-radius: 14px;
            background: rgba(253, 203, 110, 0.08);
            border: 1px solid rgba(253, 203, 110, 0.15);
            color: var(--gold);
            font-size: 18px;
            font-weight: 600;
        }
        .winner-announce span {
            display: block;
            font-size: 14px;
            font-weight: 400;
            color: var(--muted);
            margin-top: 4px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 6px;
        }
        .control-btn {
            padding: 13px 24px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
            flex: 1;
            min-width: 80px;
        }
        .control-btn:active {
            transform: scale(0.95);
        }
        .btn-reveal {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
        }
        .btn-next {
            background: rgba(253, 203, 110, 0.15);
            color: var(--gold);
            border: 1px solid rgba(253, 203, 110, 0.2);
        }
        .btn-reset {
            background: rgba(255, 255, 255, 0.05);
            color: var(--muted);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .hidden {
            display: none !important;
        }

        .footer {
            margin-top: 18px;
            font-size: 11px;
            color: var(--muted);
            opacity: 0.3;
            letter-spacing: 1px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .fade-in {
            animation: fadeInUp 0.4s ease;
        }

        @media (max-width: 420px) {
            .container {
                padding: 20px 16px;
            }
            .question-text {
                font-size: 20px;
                min-height: 50px;
            }
            .player-btn {
                font-size: 13px;
                padding: 12px 8px;
                min-height: 46px;
            }
            .result-name {
                font-size: 13px;
            }
            .control-btn {
                font-size: 12px;
                padding: 11px 16px;
                min-width: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="header">
            <h1>🎯 <span>Couple's</span> Choice</h1>
            <span class="player-count">👥 10 players</span>
        </div>

        <div class="question-number" id="qNumber">Question 1 of 12</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="question-text fade-in" id="qText">
            <span class="category">👔 STYLE</span>
            Who has the best style?
        </div>

        <div class="player-grid" id="playerGrid">
            <!-- Generated by JS -->
        </div>

        <div class="status-text" id="status">📱 Pass the phone. Everyone votes <span class="highlight">secretly</span>.</div>

        <div class="results-area hidden" id="resultsArea">
            <div id="resultsList"></div>
            <div class="winner-announce" id="winnerAnnounce">
                🏆 Winner!
                <span>with the most votes</span>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn btn-reveal" id="revealBtn" onclick="reveal()">👀 Reveal</button>
            <button class="control-btn btn-next hidden" id="nextBtn" onclick="nextQuestion()">➡️ Next</button>
            <button class="control-btn btn-reset" onclick="resetGame()">⟲ Restart</button>
        </div>

        <div class="footer">pass &amp; play • anonymous votes • no judgment</div>
    </div>

    <script>
        // ================================================================
        // 👥 EDIT YOUR 10 PLAYERS HERE
        // ================================================================
        const PLAYERS = [
            "Alex", "Jordan", "Taylor", "Morgan", "Casey",
            "Riley", "Avery", "Quinn", "Logan", "Ellis"
        ];

        // ================================================================
        // 🎯 EDIT YOUR QUESTIONS HERE
        // ================================================================
        const QUESTIONS = [
            { text: "Who has the best style?", category: "👔 STYLE" },
            { text: "Who is the funniest?", category: "😂 HUMOR" },
            { text: "Who is the best dancer?", category: "💃 DANCE" },
            { text: "Who gives the best advice?", category: "🧠 WISDOM" },
            { text: "Who is most likely to become famous?", category: "🌟 FAME" },
            { text: "Who has the best singing voice?", category: "🎤 MUSIC" },
            { text: "Who is the most adventurous?", category: "🌍 ADVENTURE" },
            { text: "Who is the best cook?", category: "🍳 FOOD" },
            { text: "Who is the most romantic?", category: "❤️ ROMANCE" },
            { text: "Who is the best storyteller?", category: "📖 STORIES" },
            { text: "Who would survive a zombie apocalypse?", category: "🧟 SURVIVAL" },
            { text: "Who is the most likely to win a Nobel Prize?", category: "🏅 BRAINS" },
        ];
        // ================================================================

        // ====== STATE ======
        let currentIndex = 0;
        let votes = [];
        let revealed = false;
        let isGameOver = false;
        const totalPlayers = PLAYERS.length;

        // ====== DOM REFS ======
        const qNumber = document.getElementById('qNumber');
        const qText = document.getElementById('qText');
        const playerGrid = document.getElementById('playerGrid');
        const status = document.getElementById('status');
        const resultsArea = document.getElementById('resultsArea');
        const resultsList = document.getElementById('resultsList');
        const winnerAnnounce = document.getElementById('winnerAnnounce');
        const revealBtn = document.getElementById('revealBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressFill = document.getElementById('progressFill');

        // ====== RENDER PLAYERS ======
        function renderPlayers() {
            playerGrid.innerHTML = '';
            PLAYERS.forEach((name, index) => {
                const btn = document.createElement('button');
                btn.className = 'player-btn';
                btn.dataset.index = index;
                btn.textContent = name;
                btn.onclick = () => vote(index);
                playerGrid.appendChild(btn);
            });
        }

        // ====== LOAD QUESTION ======
        function loadQuestion() {
            if (currentIndex >= QUESTIONS.length) {
                showGameOver();
                return;
            }

            const q = QUESTIONS[currentIndex];
            qNumber.textContent = `Question ${currentIndex + 1} of ${QUESTIONS.length}`;
            qText.innerHTML = `<span class="category">${q.category}</span> ${q.text}`;

            const pct = ((currentIndex) / QUESTIONS.length) * 100;
            progressFill.style.width = Math.min(pct, 98) + '%';

            // Reset votes
            votes = [];
            revealed = false;
            resultsArea.classList.add('hidden');
            revealBtn.classList.remove('hidden');
            nextBtn.classList.add('hidden');

            // Reset player buttons
            document.querySelectorAll('.player-btn').forEach(btn => {
                btn.className = 'player-btn';
                btn.disabled = false;
                const badge = btn.querySelector('.vote-badge');
                if (badge) badge.remove();
            });

            status.innerHTML = '📱 Pass the phone. Everyone votes <span class="highlight">secretly</span>.';
            status.style.color = '#7a85a8';
            isGameOver = false;

            qText.classList.remove('fade-in');
            void qText.offsetWidth;
            qText.classList.add('fade-in');
        }

        // ====== VOTE ======
        function vote(playerIndex) {
            if (revealed || isGameOver) return;

            // Check if this player already voted
            if (votes.includes(playerIndex)) {
                status.innerHTML = '⚠️ This person already voted. Pass to someone else.';
                status.style.color = '#e17055';
                return;
            }

            // Check if all 10 have voted
            if (votes.length >= totalPlayers) {
                status.innerHTML = '✅ All 10 voted! Tap <span class="highlight">Reveal</span>.';
                status.style.color = '#fdcb6e';
                return;
            }

            // Add vote
            votes.push(playerIndex);

            if (navigator.vibrate) navigator.vibrate(10);

            // Mark button
            const btns = document.querySelectorAll('.player-btn');
            const btn = btns[playerIndex];
            btn.classList.add('voted');
            const badge = document.createElement('span');
            badge.className = 'vote-badge';
            badge.textContent = '✓';
            btn.appendChild(badge);

            // Update status
            const remaining = totalPlayers - votes.length;
            if (remaining === 0) {
                status.innerHTML = '✅ All 10 voted! Tap <span class="highlight">Reveal</span>.';
                status.style.color = '#fdcb6e';
                revealBtn.classList.add('pulse');
                setTimeout(() => revealBtn.classList.remove('pulse'), 500);
            } else {
                status.innerHTML = `🔒 ${votes.length} voted. ${remaining} more to go. Pass the phone!`;
                status.style.color = '#6c5ce7';
            }
        }

        // ====== REVEAL ======
        function reveal() {
            if (votes.length < totalPlayers) {
                status.innerHTML = `⚠️ Need ${totalPlayers - votes.length} more votes before revealing!`;
                status.style.color = '#e17055';
                return;
            }

            revealed = true;
            resultsArea.classList.remove('hidden');
            revealBtn.classList.add('hidden');
            nextBtn.classList.remove('hidden');

            // Count votes
            const counts = {};
            PLAYERS.forEach((name, i) => {
                counts[i] = votes.filter(v => v === i).length;
            });

            // Sort by votes (highest first)
            const sorted = Object.entries(counts)
                .sort((a, b) => b[1] - a[1])
                .map(([idx, count]) => ({
                    name: PLAYERS[parseInt(idx)],
                    count: count,
                    index: parseInt(idx)
                }));

            const maxVotes = sorted[0].count;
            const winners = sorted.filter(p => p.count === maxVotes);

            // Build results list
            let html = '';
            sorted.forEach((p, i) => {
                const pct = Math.round((p.count / totalPlayers) * 100);
                const isWinner = p.count === maxVotes && maxVotes > 0;
                html += `
                    <div class="result-item">
                        <span class="result-name">${p.name}</span>
                        <div class="result-bar-wrap">
                            <div class="result-bar-fill ${isWinner ? 'winner' : ''}" style="width:${pct}%;"></div>
                        </div>
                        <span class="result-votes">${p.count}</span>
                    </div>
                `;
            });
            resultsList.innerHTML = html;

            // Winner announcement
            if (maxVotes === 0) {
                winnerAnnounce.innerHTML = '😶 No votes cast yet!';
            } else if (winners.length === 1) {
                winnerAnnounce.innerHTML = `
                    🏆 ${winners[0].name} wins!
                    <span>with ${maxVotes} out of ${totalPlayers} votes</span>
                `;
            } else {
                const names = winners.map(p => p.name).join(' & ');
                winnerAnnounce.innerHTML = `
                    🤝 It's a tie between ${names}!
                    <span>each with ${maxVotes} votes</span>
                `;
            }

            status.innerHTML = '📊 Results revealed! Tap Next.';
            status.style.color = '#fdcb6e';

            resultsArea.classList.remove('fade-in');
            void resultsArea.offsetWidth;
            resultsArea.classList.add('fade-in');
        }

        // ====== NEXT ======
        function nextQuestion() {
            currentIndex++;
            if (currentIndex >= QUESTIONS.length) {
                showGameOver();
            } else {
                loadQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // ====== GAME OVER ======
        function showGameOver() {
            isGameOver = true;
            playerGrid.style.display = 'none';
            resultsArea.classList.add('hidden');
            revealBtn.classList.add('hidden');
            nextBtn.classList.add('hidden');

            qNumber.textContent = '🎉 Game Complete!';
            qText.innerHTML = `
                <div style="padding:12px 0;">
                    <div style="font-size:48px; margin-bottom:12px;">🎊</div>
                    <h2 style="font-weight:300; font-size:22px; color:#e8edf5;">
                        You voted on ${QUESTIONS.length} questions!
                    </h2>
                    <div style="margin-top:16px; color:#7a85a8; font-size:14px; line-height:1.8;">
                        Hope you discovered something new about each other.
                    </div>
                    <div style="margin-top:20px; font-size:14px; color:#fdcb6e; background:rgba(253,203,110,0.06); padding:16px; border-radius:16px; border:1px solid rgba(253,203,110,0.1);">
                        💬 The best part? The conversations that follow.
                    </div>
                </div>
            `;
            status.innerHTML = 'Tap <span class="highlight">Restart</span> to play again.';
            progressFill.style.width = '100%';
        }

        // ====== RESET ======
        function resetGame() {
            currentIndex = 0;
            playerGrid.style.display = 'grid';
            isGameOver = false;
            renderPlayers();
            loadQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ====== KEYBOARD ======
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') reveal();
            else if (e.key === 'n' || e.key === 'N') nextQuestion();
        });

        // ====== INIT ======
        renderPlayers();
        loadQuestion();
    </script>
</body>
</html>
